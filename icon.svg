<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background container with squircle shape -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Speedometer / Steering gauge ring -->
  <path d="M 120 330 A 150 150 0 1 1 392 330" fill="none" stroke="#1e293b" stroke-width="26" stroke-linecap="round"/>
  <path d="M 120 330 A 150 150 0 1 1 360 210" fill="none" stroke="url(#accent)" stroke-width="26" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Gauge Tick Marks -->
  <line x1="140" y1="256" x2="155" y2="256" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="140" x2="256" y2="155" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <line x1="372" y1="256" x2="357" y2="256" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

  <!-- Center Automotive Play Core -->
  <circle cx="256" cy="270" r="68" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <polygon points="244,242 284,270 244,298" fill="url(#accent)" filter="url(#shadow)"/>

  <!-- Android Auto Style Signal Bars -->
  <rect x="226" y="380" width="8" height="14" rx="3" fill="#38bdf8"/>
  <rect x="242" y="374" width="8" height="20" rx="3" fill="#38bdf8"/>
  <rect x="258" y="366" width="8" height="28" rx="3" fill="#38bdf8"/>
  <rect x="274" y="360" width="8" height="34" rx="3" fill="#38bdf8"/>
</svg>
